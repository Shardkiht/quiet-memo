# quiet-memo 配置示例
# 默认读取顺序：$QUIET_MEMO_CONFIG → ./quiet-memo.toml → ~/.config/quiet-memo/config.toml

# 记忆库位置（Markdown + Git）。此处配置的 vault 优先；未配置时用 QUIET_MEMO_VAULT，
# 再缺省 ~/.quiet-memo/vault；命令行 --vault 可临时覆盖。
vault = "~/.quiet-memo/vault"

# 低于该置信度的候选不直接写入，进入待确认队列。
confidence_threshold = 0.8

# 提交后是否自动 push（需要已配置 remote）。
auto_push = false

[llm]
provider = "deepseek"
# 任意 OpenAI 兼容接口。DeepSeek 示例：
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"
# 只写环境变量名，不写 Key 本身。
api_key_env = "DEEPSEEK_API_KEY"
# 支持该参数的模型可选 low / medium / high；留空表示默认
reasoning_effort = ""
temperature = 0.1
timeout = 60.0

# 讯飞 Spark MaaS：将上面 [llm] 的对应字段替换为：
# provider = "spark"
# base_url = "https://maas-api.cn-huabei-1.xf-yun.com/v2"
# model = "spark-x2.6"
# api_key_env = "SPARK_API_KEY"
# Spark 由供应商控制采样参数，不发送 temperature / reasoning_effort。

[chat]
# 自动召回时参考最近几轮用户消息
recall_context_turns = 2
# 允许用 LLM 把追问改写成检索 query（需要 API Key）
recall_rewrite = true

[retrieval]
# keyword / vector / hybrid；hybrid 在向量后端不可用时自动回退 keyword
method = "hybrid"

[retrieval.embedding]
# local：fastembed 本地离线推理（uv sync --extra local-embed 安装，默认模型约 100MB）
# api：把记忆文本发给 embedding 供应商换取向量（注意隐私）
backend = "local"
model = "BAAI/bge-small-zh-v1.5"
# backend = "api" 时的示例：
# provider = "siliconflow"
# base_url = "https://api.siliconflow.cn/v1"
# api_key_env = "SILICONFLOW_API_KEY"

[search]
# 联网搜索开关；关闭时不注册 search 工具，行为与旧版本一致。
enabled = true
# 按顺序尝试的 provider；当前只支持 open_websearch。
providers = ["open_websearch"]
# 本地 open-websearch daemon 地址。
base_url = "http://127.0.0.1:3000"
timeout = 10.0
max_results = 5
# 搜索结果缓存秒数；0 表示不缓存。
cache_ttl = 86400
# http：调用本地 daemon；mcp：每次搜索启动 npx MCP 进程（Windows 会走 npx.cmd）。
transport = "http"
# 打开 TUI 时在后台探测并拉起 HTTP daemon（不阻塞界面）。
auto_start = true
# 上游搜索引擎；可选 bing / baidu / sogou / duckduckgo / brave / startpage 等。
# 中文品牌名被拆词时可改用 ["baidu"]；多引擎会平分结果条数。
engines = ["bing"]
# 候补引擎序列：首选引擎空结果、明显跑题或失败时按序自动降级（免费引擎，
# 仍经 open-websearch）；显式指定 search_engine 时不回退。
fallback_engines = ["baidu", "duckduckgo", "sogou"]
# 每次自动搜索最多尝试的上游引擎数（含首选）。
max_engines = 3
# 一次搜索所有回退共享的超时预算（秒）；超出即停止候补，
# 单次请求的超时也不会超过剩余预算。
timeout_budget = 25.0
# 一次搜索跨所有 provider 共享的请求次数上限；超出即停止请求，
# 返回当前已获得的最佳候选并附截断提示。
max_requests = 9
# 抓取正文的单独超时（秒）；搜索用上面的 timeout。
fetch_timeout = 45.0
