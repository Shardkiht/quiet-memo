[project]
name = "quiet-memo"
version = "0.2.0"
description = "Quiet-first personal memory: silent writes to local Markdown, powered by Git and MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shardkiht" }]
keywords = ["memory", "mcp", "markdown", "git", "agent"]
dependencies = [
    "fastmcp>=2.12",
    "jieba>=0.42",
    "keyring>=25.5",
    "litellm>=1.60",
    "numpy>=1.26",
    "openai>=1.60",
    "prompt-toolkit>=3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "textual>=8.2.8",
    "tiktoken>=0.8",
    "typer>=0.15",
]

[project.optional-dependencies]
# 本地向量检索：uv sync --extra local-embed
local-embed = ["fastembed>=0.3"]

[project.scripts]
qm = "quiet_memo.app.cli:main"
quietmemo = "quiet_memo.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiet_memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
