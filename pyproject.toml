[project]
name = "quiet-memo"
version = "0.3.2"
description = "Quiet-first personal memory: silent writes to local Markdown, powered by Git and MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shardkiht" }]
keywords = ["memory", "mcp", "markdown", "git", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

dependencies = [
    "fastmcp>=2.12",
    "httpx>=0.27",
    "jieba>=0.42",
    "keyring>=25.5",
    "litellm>=1.60",
    "numpy>=1.26",
    "openai>=1.60",
    "prompt-toolkit>=3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rank-bm25>=0.2.2",
    "rich>=13.9",
    "tenacity>=8.2",
    "textual>=8.2.8",
    "tiktoken>=0.8",
    "typer>=0.15",
]

[project.optional-dependencies]
# 本地向量检索：uv sync --extra local-embed
local-embed = ["fastembed>=0.3"]
documents = [
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.0",
]

[project.scripts]
qm = "quiet_memo.app.cli:main"
quietmemo = "quiet_memo.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/Shardkiht/quiet-memo"
Repository = "https://github.com/Shardkiht/quiet-memo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiet_memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ui: Textual 界面与交互测试",
    "agent: Agent 运行时、会话与上下文测试",
    "memory: 记忆存储、抽取、裁决与队列测试",
    "retrieval: 本地关键词与向量检索测试",
    "cli: 命令行入口测试",
    "config: 配置与供应商测试",
    "mcp: MCP 服务接口测试",
    "search: 联网搜索与抓取测试",
]
